[package]
name = "proc-etw-manifest"
version = "0.1.0"
edition = "2021"
authors = ["Marvin Gudel <marvin.s.gudel@studmail.w-hs.de>"]
license = "MIT"
description = "Proc-macro crate to generate rust code for Microsoft Windows instrumentation manifests."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.76"
quote = "1.0.35"
syn = "2.0.39"
uuid = "1.6.1"
etw-manifest = { git = "ssh://git@gitlab.internet-sicherheit.de/wissvert-mgudel/etw-manifest.git" }

